    <style>
      /* Pantalla de carga: va en el HTML para verse antes de que cargue la página. */
      #cargando { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 1.5rem; background: #1e1f19; transition: opacity 450ms ease, visibility 450ms ease; animation: cargando-seguro 400ms ease 10s forwards; }
      #cargando.cargando--fuera { opacity: 0; visibility: hidden; }
      #cargando.cargando--fuera .cargando__logo { transform: scale(1.04); }
      .cargando__logo { width: min(78vw, 22rem); height: auto; overflow: visible; transition: transform 450ms ease; }
      .cargando__texto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .cargando__logo * { transform-box: fill-box; transform-origin: center; }
      .c-onda { animation: cargando-onda 1.6s ease-in-out calc(1.7s + var(--i) * 0.12s) infinite; }
      .c-dot { animation: cargando-pop 500ms cubic-bezier(0.3, 1.6, 0.5, 1) calc(var(--i) * 90ms) both; }
      .c-arco { animation: cargando-giro 800ms cubic-bezier(0.2, 0.8, 0.2, 1) 350ms both; }
      .c-punto { animation: cargando-pop 450ms cubic-bezier(0.3, 1.6, 0.5, 1) calc(900ms + var(--i) * 110ms) both; }
      .c-marca { animation: cargando-entra 650ms cubic-bezier(0.2, 0.8, 0.2, 1) 1.05s both; }
      .c-lema { animation: cargando-lema 600ms ease 1.4s both; }
      @keyframes cargando-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
      @keyframes cargando-giro { from { opacity: 0; transform: rotate(-150deg) scale(0.6); } to { opacity: 1; transform: none; } }
      @keyframes cargando-entra { from { opacity: 0; transform: translateX(-0.75rem); } to { opacity: 1; transform: none; } }
      @keyframes cargando-lema { from { opacity: 0; } to { opacity: 0.75; } }
      @keyframes cargando-onda { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-5px); } }
      @keyframes cargando-seguro { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #cargando, .cargando__logo { transition: none; }
        .cargando__logo * { animation: none !important; }
        .c-lema { opacity: 0.75; }
      }
    </style>
